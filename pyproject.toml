
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agora-recsys"
version = "0.1.0"
description = "Personalised news recommendation with diversity-aware reranking"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "streamlit>=1.46",
    "torch>=2.2",
    "joblib>=1.3",
    "requests>=2.31",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.7",
]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
